<meta charset="utf-8">
<title>Ground Truth Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="wrap" data-view="sim">
  <div class="statusbar">
    <div class="id">Ground Truth Console</div>
    <div class="stat"><b>Seed</b><span>20260903</span></div>
    <div class="stat"><b>Cells</b><span>3</span></div>
    <div class="stat"><b>Events</b><span id="s-ev">0000</span></div>
    <div class="stat"><b>Span</b><span>1826 D</span></div>
    <div class="live"><span class="dot on" id="s-dot"></span><span id="s-mode">RUNNING</span></div>
  </div>

  <div class="body">
    <nav class="rail">
      <button class="nav sel" data-view-btn="sim">SIM</button>
      <button class="nav" data-view-btn="org">ORG</button>
      <button class="nav" data-view-btn="anl">ANL</button>
      <button class="nav" data-view-btn="dat">DAT</button>
    </nav>

    <div class="stage">
      <div id="map"></div>
      <div class="brk tl"></div><div class="brk tr"></div>
      <div class="brk bl"></div><div class="brk br"></div>
      <button class="reveal" id="rv"><span class="sw"></span>Reveal command layer</button>
      <div class="readout">
        <div><i>CUR</i> <span id="r-pos">--.--&nbsp;-&nbsp;&nbsp;---.--&nbsp;-</span></div>
        <div><i>ZOOM</i> <span id="r-scl">1.5</span> &nbsp;<i>PROJ</i> WEB-MERCATOR</div>
      </div>
      <div class="zoom">
        <button class="zb w" id="z-world">World</button>
        <button class="zb w" id="z-ao">AO</button>
        <button class="zb" id="z-out" aria-label="Zoom out">&minus;</button>
        <button class="zb" id="z-in" aria-label="Zoom in">+</button>
      </div>
      <div class="scopebar">
        <button class="zb w" id="scope-btn">Set scope (범위 지정)</button>
        <label class="scope-radius-label">R <input type="number" id="scope-radius" min="5" max="2000" step="5" value="160"> KM</label>
      </div>
    </div>

    <aside class="side">
      <div class="cells" id="cells"></div>
      <div class="results" id="results"></div>
      <div class="log">
        <div class="eyebrow">Activity feed</div>
        <div class="feed" id="feed"></div>
      </div>
    </aside>

    <div class="viewpane" id="view-anl"></div>
    <div class="viewpane" id="view-org"><div class="placeholder">Organizations view — M3</div></div>
    <div class="viewpane" id="view-dat"><div class="placeholder">Data view — M4</div></div>
  </div>

  <div class="tl">
    <div class="tlhead">
      <button class="btn on" id="pp">PAUSE</button>
      <button class="btn" data-sp="1">1&times;</button>
      <button class="btn on" data-sp="7">7&times;</button>
      <button class="btn" data-sp="30">30&times;</button>
      <div class="eyebrow" style="margin-left:6px">Time window (기간)</div>
      <label class="win-input">START <input type="number" id="win-start" min="0"></label>
      <label class="win-input">END <input type="number" id="win-end" min="0"></label>
      <div class="dtg" id="dtg">010000Z JAN 26</div>
    </div>
    <canvas id="wac"></canvas>
  </div>

  <div class="boot" id="boot"></div>
</div>

<script src="vendor/deck.gl.min.js"></script>
<script type="module" src="js/main.js"></script>
