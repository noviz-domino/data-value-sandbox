<meta charset="utf-8">
<title>Ground Truth Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- M4 scaffold: 조직/데이터/투어 뷰는 각자 자기 CSS 파일만 건드린다(style.css를 공유 편집하지
     않도록 접촉면을 미리 갈라둔다). 지금은 각 파일이 최소 스텁 스타일만 담고 있다. -->
<link rel="stylesheet" href="css/org-view.css">
<link rel="stylesheet" href="css/data-view.css">
<link rel="stylesheet" href="css/tour.css">

<div class="wrap" data-view="sim">
  <div class="statusbar">
    <div class="id">Ground Truth Console</div>
    <div class="stat"><b id="lbl-seed">Seed</b><span>20260903</span></div>
    <!-- M4-T? ground-truth 분리(§Job1): 셀(조직) 개수는 지휘 계층 정보라 reveal이 꺼지면
         main.js가 이 블록 전체를 hidden 처리한다 — 값(3)만 지우면 레이아웃 자리가 남아 "뭔가
         숨겼다"는 티가 나므로 블록째 뺀다. -->
    <div class="stat" id="stat-cells"><b id="lbl-cells">Cells</b><span>3</span></div>
    <div class="stat"><b id="lbl-events">Events</b><span id="s-ev">0000</span></div>
    <div class="stat"><b id="lbl-span">Span</b><span>1826 D</span></div>
    <div class="live"><span class="dot on" id="s-dot"></span><span id="s-mode">RUNNING</span></div>
    <div class="langtoggle" id="langtoggle">
      <button class="lang-btn" data-lang="ko" type="button">한국어</button>
      <button class="lang-btn" data-lang="en" type="button">English</button>
    </div>
  </div>

  <div class="body">
    <nav class="rail">
      <button class="nav sel" data-view-btn="sim">SIM</button>
      <button class="nav" data-view-btn="org">ORG</button>
      <button class="nav" data-view-btn="anl">ANL</button>
      <button class="nav" data-view-btn="dat">DAT</button>
    </nav>

    <div class="stage">
      <div id="map"></div>
      <!-- 코너 장식 4개: 예전엔 class="brk tl"처럼 tl/tr/bl/br을 썼는데, 화면 맨 아래 진짜
           시간창 패널도 class="tl"이라 .tl 셀렉터가 이 좌상단 장식까지 덮쳐써 배경색·패딩이
           새어 들어왔다(정체불명의 회색 사각형 버그). brk-tl처럼 합성 클래스 하나로 바꿔
           어떤 다른 컴포넌트와도 안 겹치게 한다. -->
      <div class="brk brk-tl"></div><div class="brk brk-tr"></div>
      <div class="brk brk-bl"></div><div class="brk brk-br"></div>
      <button class="reveal" id="rv"><span class="sw"></span><span id="rv-label">Reveal command layer</span></button>
      <div class="readout">
        <div><i id="lbl-cur">CUR</i> <span id="r-pos">--.--&nbsp;-&nbsp;&nbsp;---.--&nbsp;-</span></div>
        <div><i id="lbl-zoom">ZOOM</i> <span id="r-scl">1.5</span> &nbsp;<i id="lbl-proj">PROJ</i> WEB-MERCATOR</div>
      </div>
      <div class="zoom">
        <button class="zb w" id="z-world">World</button>
        <button class="zb w" id="z-ao">AO</button>
        <button class="zb" id="z-out" aria-label="Zoom out">&minus;</button>
        <button class="zb" id="z-in" aria-label="Zoom in">+</button>
      </div>
      <div class="scopebar">
        <button class="zb w" id="scope-btn">Set scope</button>
        <label class="scope-radius-label">R <input type="number" id="scope-radius" min="5" max="2000" step="5" value="160"> KM</label>
      </div>
    </div>

    <aside class="side">
      <div class="cells" id="cells"></div>
      <div class="results" id="results"></div>
      <div class="log">
        <div class="eyebrow" id="lbl-activity-feed">Activity feed</div>
        <div class="feed" id="feed"></div>
      </div>
    </aside>

    <div class="viewpane" id="view-anl"></div>
    <!-- M4 scaffold: 내용은 org-view.js/data-view.js가 각자 createOrgView()/createDataView()의
         render()에서 채운다(main.js는 더 이상 이 두 div의 placeholder 텍스트를 직접 건드리지
         않는다) — 정적 placeholder를 여기 남겨두면 첫 render() 이후 그 자식 엘리먼트가 통째로
         지워지므로, 아예 빈 컨테이너로 둔다. -->
    <div class="viewpane" id="view-org"></div>
    <div class="viewpane" id="view-dat"></div>
  </div>

  <div class="tl">
    <div class="tlhead">
      <button class="btn on" id="pp">PAUSE</button>
      <button class="btn" data-sp="1">1&times;</button>
      <button class="btn on" data-sp="7">7&times;</button>
      <button class="btn" data-sp="30">30&times;</button>
      <div class="eyebrow" id="lbl-timewindow" style="margin-left:6px">Time window</div>
      <label class="win-input"><span id="lbl-win-start">START</span> <input type="number" id="win-start" min="0"></label>
      <label class="win-input"><span id="lbl-win-end">END</span> <input type="number" id="win-end" min="0"></label>
      <div class="dtg" id="dtg">010000Z JAN 26</div>
    </div>
    <canvas id="wac"></canvas>
  </div>

  <div class="boot" id="boot"></div>
  <!-- M4 재실행(rerun) 진행 배너 (Fix2) — 기본은 hidden, main.js가 performRerun() 동안만 보여준다.
       텍스트는 항상 t()로 채운다(app.rerunBanner). -->
  <div class="rerun-banner" id="rerun-banner" hidden></div>
</div>

<script src="vendor/deck.gl.min.js"></script>
<script type="module" src="js/main.js"></script>
